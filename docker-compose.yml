version: '3'
volumes:
    camajora_data_odoo:
    camajora_pgdata_odoo:
services:
  odoo:
    build: .
    image: mudesrl/camajora-backend:1.0
    ports:
      - 80:80
      - 8069:8069
    depends_on:
      - postgres
    links:
      - "postgres:postgres"
    environment:
      - ODOO_DB_HOST=postgres
      - ODOO_DB_NAME=odoo_camajora
      - ODOO_DB_USER=odoo
      - ODOO_DB_PASSWORD=odoo
      - ODOO_WORKERS=7
      - ODOO_LIMIT_TIME_CPU=120000
      - ODOO_LIMIT_TIME_REAL=132000
      - ODOO_QUEUE_JOB_CHANNELS=root:6
      - ODOO_LIMIT_MEMORY_HARD=6845104128
      - ODOO_LIMIT_MEMORY_SOFT=5704253440
    volumes:
      - "camajora_data_odoo:/var/lib/odoo/"
      # mount volumes for dev needs
      - "./addons/camajora-addons:/mnt/bundle-addons/camajora-addons"
    # launch container in odoo dev mode
    command: run  -d odoo_camajora --dev=all --db-filter odoo_camajora
  postgres:
    image: postgres:10.0
    ports:
       - 5432:5432
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - "camajora_pgdata_odoo:/var/lib/postgresql/data"

  
