kind: pipeline
name: staging
steps:
  - name: submodules
    image: alpine/git
    environment:
      SSH_KEY: 
        from_secret: bitbucket_ssh_key
    commands:
      - mkdir -p $HOME/.ssh
      - echo -e "$SSH_KEY\n" > $HOME/.ssh/id_rsa
      - chmod 600 $HOME/.ssh/id_rsa
      - ssh-keyscan bitbucket.org > /root/.ssh/known_hosts
      - git submodule update --init --recursive --depth=1
      
  - name: docker  
    image: plugins/docker
    settings:
      repo: metadonors/camajora-odoo
      tags: 
        - staging
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
  
  - name: slack
    image: plugins/slack
    settings:
      username: Marvin il DevOps
      icon_url: https://cdn4.iconfinder.com/data/icons/free-large-android-icons/512/Paranoid_android_with_shadow.png
      webhook: 
        from_secret: slack_hook
      template: Immagine Camajora _staging_ aggiornata
      
trigger:
  branch:
    - master
  event:
    - push

---

kind: pipeline
name: production
steps:
  - name: submodules
    image: alpine/git
    environment:
      SSH_KEY: 
        from_secret: bitbucket_ssh_key
    commands:
      - mkdir -p $HOME/.ssh
      - echo -e "$SSH_KEY\n" > $HOME/.ssh/id_rsa
      - chmod 600 $HOME/.ssh/id_rsa
      - ssh-keyscan bitbucket.org > /root/.ssh/known_hosts
      - git submodule update --init --recursive --depth=1
      
  - name: docker  
    image: plugins/docker
    settings:
      repo: metadonors/camajora-odoo
      tags: 
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
  
  - name: slack
    image: plugins/slack
    settings:
      username: Marvin il DevOps
      icon_url: https://cdn4.iconfinder.com/data/icons/free-large-android-icons/512/Paranoid_android_with_shadow.png
      webhook: 
        from_secret: slack_hook
      template: Immagine Camajora _latest_ aggiornata
      
trigger:
  branch:
    - master
  event:
    - push
